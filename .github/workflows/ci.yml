name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install flake8
      - name: flake8
        run: flake8 src/ tests/

  type-check:
    runs-on: ubuntu-latest
    continue-on-error: true  # mypy非阻塞（渐进收紧）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and mypy
        run: |
          pip install -e .
          pip install mypy types-PyYAML types-requests
      - name: mypy
        run: mypy src/blivepost

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project with dev deps
        run: pip install -e ".[dev]"
      - name: Run tests
        env:
          # 测试不依赖真实凭证
          BLIVEPOST_QQBOT_APP_ID: ""
        run: pytest tests/ -q
