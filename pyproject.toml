[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blivepost"
version = "1.1.0"
description = "B站直播监控与推送系统"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Luomuyu"}
]
keywords = ["bilibili", "live", "monitor", "push", "qq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP",
]

# 注意：blivedm不在依赖中，由vendor机制在运行时自动下载（见src/blivepost/vendor/）
# playwright chromium浏览器内核在程序启动时自动安装到运行目录ms-playwright/（见services/bili_login.py）
dependencies = [
    "requests>=2.32.0",
    "pyyaml>=6.0.3",
    "aiohttp>=3.13.0",
    "Brotli>=1.2.0",
    "pure-protobuf>=3.1.0",
    "yarl>=1.23.0",
    "redis>=7.2.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "aiomysql>=0.2.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.3.0",
    "qq-botpy-v2>=1.0.1",
    "playwright>=1.40.0",
    "qrcode[pil]>=7.4",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
blivepost = "blivepost.__main__:main"

[project.urls]
Homepage = "https://github.com/luomuyu/blivepost"
Repository = "https://github.com/luomuyu/blivepost"
Issues = "https://github.com/luomuyu/blivepost/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blivepost = ["py.typed", "services/templates/*.html", "services/templates/partials/*.html", "services/templates/pages/*.html"]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
warn_unreachable = false

[[tool.mypy.overrides]]
module = [
    "blivedm.*",
    "yaml",
    "botpy.*",
    "redis.*",
    "qrcode.*",
    "playwright.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
