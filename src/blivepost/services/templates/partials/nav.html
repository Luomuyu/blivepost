<nav class="nav-scroll -mx-1 mb-4 flex items-center gap-1 overflow-x-auto whitespace-nowrap">
  {% for path, key, label in nav %}
  <a href="{{ path }}" hx-get="{{ path }}" hx-target="#page" hx-swap="outerHTML" hx-push-url="{{ path }}"
     class="shrink-0 px-3 py-1.5 rounded-lg text-sm transition-colors {{ 'nav-active' if page == key else 'text-slate-400 hover:text-slate-200 hover:bg-slate-900' }}">{{ label }}</a>
  {% endfor %}
</nav>
