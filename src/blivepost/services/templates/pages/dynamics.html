<div id="page" hx-target="#page" hx-swap="outerHTML">
  {% include 'partials/nav.html' %}
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-base font-semibold text-slate-300">动态监控 <span class="text-slate-500 text-sm font-normal">{{ dynamics | length }}个订阅</span></h1>
    <button hx-get="/dynamics" hx-target="#page" hx-swap="outerHTML"
            class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs hover:bg-slate-700">手动刷新</button>
  </div>

  <!-- 订阅表单 -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-5">
    <form id="dyn-actions" class="flex flex-wrap items-end gap-3 text-sm">
      <div>
        <label class="block text-xs text-slate-500 mb-1">群</label>
        <select name="group_openid" class="bg-slate-800 text-slate-200 rounded-lg px-3 py-2 border border-slate-700 focus:outline-none focus:border-blue-500 min-w-[13rem]">
          {% for g in group_options %}
          <option value="{{ g[0] }}">{{ g[1] or g[0] }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs text-slate-500 mb-1">UP主UID</label>
        <input name="up_uid" placeholder="UP主UID" required
               class="bg-slate-800 text-slate-200 rounded-lg px-3 py-2 border border-slate-700 focus:outline-none focus:border-blue-500 w-40">
      </div>
      <button hx-post="/web/dynamic/bind" hx-include="#dyn-actions"
              class="px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium">绑定动态</button>
      <button hx-post="/web/dynamic/unbind" hx-include="#dyn-actions"
              class="px-3 py-2 rounded-lg bg-red-600/80 hover:bg-red-500 text-white text-xs font-medium">取消动态</button>
    </form>
    <p class="text-xs text-slate-500 mt-2">需开启 dynamic_monitor 开关；最后一个订阅群取消后轮询进程自动停止。</p>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-xs text-slate-500 text-left bg-slate-900/60">
            <th class="px-5 py-2.5 font-medium">UP主UID</th>
            <th class="px-4 py-2.5 font-medium">昵称</th>
            <th class="px-4 py-2.5 font-medium">轮询进程</th>
            <th class="px-4 py-2.5 font-medium">订阅群数</th>
          </tr>
        </thead>
        <tbody>
          {% for d in dynamics %}
          <tr class="border-t border-slate-800 hover:bg-slate-800/40">
            <td class="px-5 py-2.5 font-mono">{{ d.up_uid }}</td>
            <td class="px-4 py-2.5">{{ d.name or '-' }}</td>
            <td class="px-4 py-2.5">
              {% if d.alive %}
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs bg-emerald-500/10 text-emerald-400">轮询中</span>
              {% else %}
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs bg-red-500/10 text-red-400">未运行</span>
              {% endif %}
            </td>
            <td class="px-4 py-2.5">{{ d.groups }}</td>
          </tr>
          {% else %}
          <tr><td colspan="4" class="px-5 py-6 text-center text-slate-500">暂无订阅</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
