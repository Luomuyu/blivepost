<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLivePost 状态面板</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
<style>
  /* ===== 主题变量（夜间默认；日间跟随浏览器prefers-color-scheme自动切换）===== */
  :root{
    color-scheme: dark;
    --bg: #020617;         /* slate-950 页面底 */
    --surface: #0f172a;    /* slate-900 卡片 */
    --surface-2: #1e293b;  /* slate-800 输入/按钮/悬停行 */
    --surface-3: #334155;  /* slate-700 悬停增强 */
    --border: #1e293b;
    --border-strong: #334155;
    --text: #e2e8f0;
    --text-strong: #f1f5f9;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --ok: #34d399;
    --ok-soft: rgba(52,211,153,.1);
    --bad: #f87171;
    --bad-soft: rgba(248,113,113,.1);
    --blue-text: #60a5fa;
    --amber-text: #f59e0b;
    --grid: #1e293b;
    --axis: #94a3b8;
    --tip-bg: rgba(30,41,59,.95);
    --tip-border: #334155;
    --tip-text: #e2e8f0;
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme: light;
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-3: #e2e8f0;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #1e293b;
      --text-strong: #0f172a;
      --muted: #64748b;
      --muted-2: #475569;
      --ok: #059669;
      --ok-soft: rgba(5,150,105,.1);
      --bad: #dc2626;
      --bad-soft: rgba(220,38,38,.1);
      --blue-text: #2563eb;
      --amber-text: #b45309;
      --grid: #e2e8f0;
      --axis: #64748b;
      --tip-bg: rgba(255,255,255,.97);
      --tip-border: #cbd5e1;
      --tip-text: #1e293b;
    }
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}

  /* ===== 主题覆盖层：把模板中的固定slate色阶映射到主题变量 ===== */
  body{background:var(--bg);color:var(--text)}
  .bg-slate-950, .bg-slate-950\/80{background:var(--bg)!important}
  .bg-slate-900, .bg-slate-900\/60, .bg-slate-900\/80, .bg-slate-900\/95{background:var(--surface)!important}
  .bg-slate-800, .bg-slate-800\/95{background:var(--surface-2)!important}
  .bg-slate-700{background:var(--surface-3)!important}
  .hover\:bg-slate-700:hover{background:var(--surface-3)!important}
  .hover\:bg-slate-600:hover{background:var(--surface-3)!important}
  .hover\:bg-slate-900:hover{background:var(--surface-2)!important}
  .hover\:bg-slate-800\/40:hover{background:var(--surface-2)!important}
  .border-slate-800{border-color:var(--border)!important}
  .border-slate-700{border-color:var(--border-strong)!important}
  .border-slate-600{border-color:var(--border-strong)!important}
  .text-slate-100{color:var(--text-strong)!important}
  .text-slate-200{color:var(--text)!important}
  .text-slate-300{color:var(--text)!important}
  .text-slate-400{color:var(--muted-2)!important}
  .text-slate-500{color:var(--muted)!important}
  .text-slate-600{color:var(--muted)!important}
  .hover\:text-slate-200:hover{color:var(--text)!important}
  .text-emerald-400{color:var(--ok)!important}
  .text-red-400{color:var(--bad)!important}
  .bg-emerald-500\/10{background:var(--ok-soft)!important}
  .bg-red-500\/10{background:var(--bad-soft)!important}
  .bg-slate-600\/30{background:var(--surface-3)!important}
  .text-blue-400{color:var(--blue-text)!important}
  .text-amber-500{color:var(--amber-text)!important}
  #trend-tip{background:var(--tip-bg)!important;border-color:var(--tip-border)!important;color:var(--tip-text)!important}

  /* ===== 导航激活标签（专属类走主题变量，避免固定色阶在日间模式下白字浅底）===== */
  .nav-active{background:var(--surface-3)!important;color:var(--text-strong)!important;font-weight:600}

  /* ===== 移动端适配 ===== */
  .nav-scroll{scrollbar-width:none;-ms-overflow-style:none}
  .nav-scroll::-webkit-scrollbar{display:none}
  @media (max-width:640px){
    body{font-size:14px}
    main{padding:.75rem .75rem 1.5rem}
    table{font-size:12px}
    th,td{padding:4px 6px}
  }
</style>
<script>
/* 弹幕词云（原生JS）：圆形布局——频率越高字号越大越靠圆心；无外部依赖 */
window.__wcLayout = null;   // 当前布局（导出图片用）：[{word,count,px,x,y,color}]
window.__wcMeta = null;     // {W,H,label}

window.renderWordCloud = function(){
  var box = document.getElementById('wordcloud');
  if(!box) return;
  var spans = [...box.querySelectorAll('.wc-word')];
  box.style.position = 'relative';
  box.classList.add('justify-start');
  box.classList.remove('items-center', 'justify-center');
  if(!spans.length){ window.__wcLayout = null; return; }

  var W = box.clientWidth || 800;
  var H = Math.max(300, Math.min(520, Math.round(W * 0.45)));
  box.style.height = H + 'px';

  var counts = spans.map(w => +w.dataset.count || 1);
  var max = Math.max(...counts), min = Math.min(...counts);
  var minPx = 13, maxPx = 40;
  var palette = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
    ? ['#2563eb', '#d97706', '#059669', '#dc2626', '#7c3aed', '#0f766e', '#be185d']
    : ['#60a5fa', '#f59e0b', '#34d399', '#f87171', '#a78bfa', '#2dd4bf', '#f472b6'];
  function fontOf(c){
    var t = max === min ? 0.5 : (Math.log(c) - Math.log(min)) / (Math.log(max) - Math.log(min));
    return Math.round(minPx + t * (maxPx - minPx));
  }

  /* 测量：隐藏绝对定位后读实际宽高 */
  spans.forEach((w, i) => {
    w.style.fontSize = fontOf(counts[i]) + 'px';
    w.style.fontWeight = fontOf(counts[i]) > 28 ? '700' : '500';
    w.style.position = 'absolute';
    w.style.visibility = 'hidden';
    w.style.whiteSpace = 'nowrap';
    w.style.left = '0'; w.style.top = '0';
  });

  var placed = [];   // {x,y,w,h} 左上角矩形
  function overlaps(r){
    for(var i = 0; i < placed.length; i++){
      var q = placed[i];
      if(r.x < q.x + q.w + 3 && r.x + r.w + 3 > q.x &&
         r.y < q.y + q.h + 2 && r.y + r.h + 2 > q.y) return true;
    }
    return false;
  }
  function within(r){
    return r.x >= 2 && r.y >= 2 && r.x + r.w <= W - 2 && r.y + r.h <= H - 2;
  }

  var cx = W / 2, cy = H / 2;
  var layout = [];
  spans.forEach((w, i) => {
    var cw = w.offsetWidth, ch = w.offsetHeight;
    var px = fontOf(counts[i]);
    var theta = i * 2.39996;               // 黄金角：均匀散开
    var r = i === 0 ? 0 : 4;
    var rect = null, scale = 1;
    for(var attempt = 0; attempt < 2 && !rect; attempt++){
      theta = i * 2.39996; r = i === 0 ? 0 : 4;
      for(var step = 0; step < 900; step++){
        var x = cx + (r * 1.5) * Math.cos(theta);
        var y = cy + (r * 0.62) * Math.sin(theta);
        var cand = {x: x - cw * scale / 2, y: y - ch * scale / 2,
                    w: cw * scale, h: ch * scale};
        if(within(cand) && !overlaps(cand)){ rect = cand; break; }
        theta += 0.45; r += 0.7;
        if(r > Math.max(W, H)) break;
      }
      if(!rect){ scale = 0.72; w.style.fontSize = Math.round(px * scale) + 'px';
                 cw = w.offsetWidth; ch = w.offsetHeight; }
    }
    if(!rect){ rect = {x: Math.max(2, Math.min(W - cw - 2, cx - cw / 2)),
                       y: Math.max(2, Math.min(H - ch - 2, cy - ch / 2)),
                       w: cw, h: ch}; }
    placed.push(rect);
    w.style.visibility = 'visible';
    w.style.left = rect.x + 'px'; w.style.top = rect.y + 'px';
    var color = palette[i % palette.length];
    w.style.color = color;
    layout.push({word: w.textContent, count: counts[i], px: px,
                 x: rect.x + rect.w / 2, y: rect.y + rect.h / 2,
                 color: color, weight: px > 28 ? '700' : '500'});
  });

  var labelEl = document.querySelector('#wordcloud-panel h2');
  window.__wcLayout = layout;
  window.__wcMeta = {W: W, H: H,
                     label: labelEl ? labelEl.textContent.replace(/\s+/g, ' ').trim() : ''};
};

var __wcRt = null;
window.addEventListener('resize', function(){
  clearTimeout(__wcRt);
  __wcRt = setTimeout(function(){ if(document.getElementById('wordcloud')) renderWordCloud(); }, 200);
});

/* 导出词云图片：布局→SVG→Canvas→PNG下载（含标签与主题底色） */
window.exportWordCloud = function(){
  var layout = window.__wcLayout, meta = window.__wcMeta;
  if(!layout || !layout.length){ alert('暂无词云数据'); return; }
  function esc(t){ return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#020617';
  var fg = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#64748b';
  var parts = ['<svg xmlns="http://www.w3.org/2000/svg" width="' + meta.W + '" height="' + meta.H + '">',
               '<rect width="100%" height="100%" fill="' + esc(bg) + '"/>'];
  layout.forEach(it => {
    parts.push('<text x="' + it.x.toFixed(1) + '" y="' + it.y.toFixed(1) + '" ' +
               'font-family="system-ui, sans-serif" ' +
               'font-size="' + it.px + '" font-weight="' + it.weight + '" ' +
               'fill="' + it.color + '" text-anchor="middle" dominant-baseline="central">' +
               esc(it.word) + '</text>');
  });
  parts.push('</svg>');
  var svg = parts.join('');
  var url = URL.createObjectURL(new Blob([svg], {type: 'image/svg+xml;charset=utf-8'}));
  var img = new Image();
  img.onload = function(){
    var scale = 2;
    var cv = document.createElement('canvas');
    cv.width = meta.W * scale; cv.height = meta.H * scale + 0;
    var ctx = cv.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillStyle = fg;
    ctx.fillText(meta.label, 10, 16);
    cv.toBlob(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '词云_' + meta.label.replace(/[\/:*?"<>|\s]+/g, '_') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  };
  img.onerror = function(){ URL.revokeObjectURL(url); alert('导出失败，请重试'); };
  img.src = url;
};</script>
<script>
/* 收入趋势图（原生JS，无外部依赖）：按容器宽度绘制SVG，resize重绘；悬停/触摸显示各日明细 */
window.renderTrend = function(data, mode){
  var el = document.getElementById('trend'), tip = document.getElementById('trend-tip');
  if(!el) return;
  if(!data || !data.length){ el.innerHTML = '<p class="py-10 text-center text-sm text-slate-500">暂无趋势数据</p>'; return; }
  function lightMode(){
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  }
  var S = [["danmaku","#60a5fa","弹幕"],["gift_gold","#f59e0b","礼物(元)"],
           ["ship_gold","#34d399","上舰(元)"],["sc_total","#f87171","SC(元)"]];
  var S_LIGHT = [["danmaku","#2563eb","弹幕"],["gift_gold","#d97706","礼物(元)"],
                 ["ship_gold","#059669","上舰(元)"],["sc_total","#dc2626","SC(元)"]];
  function fmt(v){ v = +v||0; return Math.abs(v)>=100 ? String(Math.round(v)) : (Math.round(v*10)/10).toString(); }
  var PL=44, PR=12, step=0, n=0;
  function draw(){
    var isLight = lightMode();
    var series = isLight ? S_LIGHT : S;
    var W = el.clientWidth || 600; if(W < 260) W = 260;
    var H = 250, iw = W-PL-PR, ih = H-40; n = data.length;
    var peak = 1;
    for(var s=0;s<series.length;s++){
      var arr = data.map(function(r){ return +r[series[s][0]]||0; });
      series[s][3] = arr;
      for(var i=0;i<arr.length;i++) if(arr[i]>peak) peak = arr[i];
    }
    function X(i){ return PL + (n>1 ? i*iw/(n-1) : iw/2); }
    function Y(v){ return 14 + ih - (v/peak)*ih; }
    step = n>1 ? iw/(n-1) : 0;
    var g = '';
    for(var f=0;f<=4;f++){
      var y = 14 + ih - ih*f/4;
      g += '<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="var(--grid)"/>' +
           '<text x="'+(PL-6)+'" y="'+(y+3)+'" font-size="10" fill="#64748b" text-anchor="end">'+fmt(peak*f/4)+'</text>';
    }
    var labN = Math.min(n, Math.max(2, Math.floor(W/90)));
    for(var j=0;j<labN;j++){
      var i2 = labN>1 ? Math.round(j*(n-1)/(labN-1)) : 0;
      var lab = data[i2].day;
      if(mode === 'monthly' && lab.length >= 7) lab = lab.slice(0, 7);
      else if(lab.length >= 10) lab = lab.slice(5, 10);
      g += '<text x="'+X(i2)+'" y="'+(H-8)+'" font-size="10" fill="#64748b" text-anchor="middle">'+lab+'</text>';
    }
    var sv = '<svg width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg">'+g;
    for(var s2=0;s2<series.length;s2++){
      var pts = series[s2][3].map(function(v,i3){ return X(i3).toFixed(1)+','+Y(v).toFixed(1); }).join(' ');
      sv += '<polyline fill="none" stroke="'+series[s2][1]+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts+'"/>';
    }
    sv += '</svg>';
    el.innerHTML = sv;
    var svg = el.querySelector('svg');
    function pos(e){
      var cx = (e.touches ? e.touches[0].clientX : e.clientX);
      var r = svg.getBoundingClientRect();
      var i = step ? Math.round((cx - r.left - PL)/step) : 0;
      i = Math.max(0, Math.min(n-1, i));
      var rows = '<b>'+data[i].day+'</b>';
      for(var s3=0;s3<series.length;s3++)
        rows += '<br><span style="color:'+series[s3][1]+'">●</span> '+series[s3][2]+': '+fmt(series[s3][3][i]);
      tip.innerHTML = rows;
      tip.classList.remove('hidden');
      var box = el.parentElement.getBoundingClientRect();
      var lx = cx - box.left + 14;
      if(lx + 150 > box.width) lx = cx - box.left - 164;
      if(lx < 0) lx = 0;
      tip.style.left = lx+'px'; tip.style.top = '10px';
    }
    function hide(){ tip.classList.add('hidden'); }
    svg.addEventListener('mousemove', pos);
    svg.addEventListener('mouseleave', hide);
    svg.addEventListener('touchstart', pos, {passive:true});
    svg.addEventListener('touchmove', pos, {passive:true});
    svg.addEventListener('touchend', hide);
  }
  var rt = null;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(draw, 200); });
  if(window.matchMedia){
    try{ window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){ draw(); }); }catch(e){}
  }
  draw();
};
</script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans antialiased">
<header class="sticky top-0 z-20 backdrop-blur bg-slate-950/80 border-b border-slate-800">
  <div class="max-w-6xl mx-auto px-4 py-3">
    <div class="flex items-center justify-between gap-2">
      <a href="/" hx-get="/" hx-target="#page" hx-swap="outerHTML" hx-push-url="/"
         class="flex items-center gap-2 min-w-0">
        <span class="w-2.5 h-2.5 rounded-full bg-pink-500 shadow-[0_0_8px_rgba(236,72,153,.8)] shrink-0"></span>
        <span class="text-lg font-bold tracking-wide truncate">BLivePost <span class="text-slate-500 font-normal text-sm">面板</span></span>
      </a>
      <div class="flex items-center gap-2 shrink-0">
        <span class="hidden sm:inline text-xs text-slate-500">只读数据 · 操作需谨慎</span>
        {% if current_user %}
        <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs {{ 'bg-emerald-500/10 text-emerald-400' if is_admin else 'bg-blue-500/10 text-blue-400' }}">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          {{ current_user }}{{ '（管理员）' if is_admin }}
        </span>
        {% if is_admin %}
        <a href="/admin" class="px-2.5 py-1 rounded-lg text-xs bg-slate-800 text-slate-300 hover:bg-slate-700">后台</a>
        {% endif %}
        <button onclick="webLogout()" class="px-2.5 py-1 rounded-lg text-xs bg-slate-800 text-slate-300 hover:bg-slate-700">退出</button>
        <script>
        function webLogout(){
          fetch('/web/logout', {method: 'POST'}).then(() => { location.href = '/'; location.reload(); });
        }
        </script>
        {% else %}
        <a href="/login" title="点击登录"
           class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs bg-slate-700/50 text-slate-300 hover:bg-slate-700 hover:text-slate-100">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          游客（只读）
        </a>
        {% endif %}
      </div>
    </div>
  </div>
</header>
<main class="max-w-6xl mx-auto px-4 py-6">
  {% include page_template %}
</main>
</body>
</html>
