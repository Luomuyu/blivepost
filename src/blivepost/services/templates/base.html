<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLivePost 状态面板</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
<style>
  /* ===== 主题变量（夜间默认；日间跟随浏览器prefers-color-scheme自动切换）===== */
  :root{
    color-scheme: dark;
    --bg: #020617;         /* slate-950 页面底 */
    --surface: #0f172a;    /* slate-900 卡片 */
    --surface-2: #1e293b;  /* slate-800 输入/按钮/悬停行 */
    --surface-3: #334155;  /* slate-700 悬停增强 */
    --border: #1e293b;
    --border-strong: #334155;
    --text: #e2e8f0;
    --text-strong: #f1f5f9;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --ok: #34d399;
    --ok-soft: rgba(52,211,153,.1);
    --bad: #f87171;
    --bad-soft: rgba(248,113,113,.1);
    --blue-text: #60a5fa;
    --amber-text: #f59e0b;
    --grid: #1e293b;
    --axis: #94a3b8;
    --tip-bg: rgba(30,41,59,.95);
    --tip-border: #334155;
    --tip-text: #e2e8f0;
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme: light;
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-3: #e2e8f0;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #1e293b;
      --text-strong: #0f172a;
      --muted: #64748b;
      --muted-2: #475569;
      --ok: #059669;
      --ok-soft: rgba(5,150,105,.1);
      --bad: #dc2626;
      --bad-soft: rgba(220,38,38,.1);
      --blue-text: #2563eb;
      --amber-text: #b45309;
      --grid: #e2e8f0;
      --axis: #64748b;
      --tip-bg: rgba(255,255,255,.97);
      --tip-border: #cbd5e1;
      --tip-text: #1e293b;
    }
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}

  /* ===== 主题覆盖层：把模板中的固定slate色阶映射到主题变量 ===== */
  body{background:var(--bg);color:var(--text)}
  .bg-slate-950, .bg-slate-950\/80{background:var(--bg)!important}
  .bg-slate-900, .bg-slate-900\/60, .bg-slate-900\/80, .bg-slate-900\/95{background:var(--surface)!important}
  .bg-slate-800, .bg-slate-800\/95{background:var(--surface-2)!important}
  .bg-slate-700{background:var(--surface-3)!important}
  .hover\:bg-slate-700:hover{background:var(--surface-3)!important}
  .hover\:bg-slate-600:hover{background:var(--surface-3)!important}
  .hover\:bg-slate-900:hover{background:var(--surface-2)!important}
  .hover\:bg-slate-800\/40:hover{background:var(--surface-2)!important}
  .border-slate-800{border-color:var(--border)!important}
  .border-slate-700{border-color:var(--border-strong)!important}
  .border-slate-600{border-color:var(--border-strong)!important}
  .text-slate-100{color:var(--text-strong)!important}
  .text-slate-200{color:var(--text)!important}
  .text-slate-300{color:var(--text)!important}
  .text-slate-400{color:var(--muted-2)!important}
  .text-slate-500{color:var(--muted)!important}
  .text-slate-600{color:var(--muted)!important}
  .hover\:text-slate-200:hover{color:var(--text)!important}
  .text-emerald-400{color:var(--ok)!important}
  .text-red-400{color:var(--bad)!important}
  .bg-emerald-500\/10{background:var(--ok-soft)!important}
  .bg-red-500\/10{background:var(--bad-soft)!important}
  .bg-slate-600\/30{background:var(--surface-3)!important}
  .text-blue-400{color:var(--blue-text)!important}
  .text-amber-500{color:var(--amber-text)!important}
  #trend-tip{background:var(--tip-bg)!important;border-color:var(--tip-border)!important;color:var(--tip-text)!important}

  /* ===== 导航激活标签（专属类走主题变量，避免固定色阶在日间模式下白字浅底）===== */
  .nav-active{background:var(--surface-3)!important;color:var(--text-strong)!important;font-weight:600}

  /* ===== 移动端适配 ===== */
  .nav-scroll{scrollbar-width:none;-ms-overflow-style:none}
  .nav-scroll::-webkit-scrollbar{display:none}
  @media (max-width:640px){
    body{font-size:14px}
    main{padding:.75rem .75rem 1.5rem}
    table{font-size:12px}
    th,td{padding:4px 6px}
  }
</style>
<script>
/* 收入趋势图（原生JS，无外部依赖）：按容器宽度绘制SVG，resize重绘；悬停/触摸显示各日明细 */
window.renderTrend = function(data, mode){
  var el = document.getElementById('trend'), tip = document.getElementById('trend-tip');
  if(!el) return;
  if(!data || !data.length){ el.innerHTML = '<p class="py-10 text-center text-sm text-slate-500">暂无趋势数据</p>'; return; }
  function lightMode(){
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  }
  var S = [["danmaku","#60a5fa","弹幕"],["gift_gold","#f59e0b","礼物(元)"],
           ["ship_gold","#34d399","上舰(元)"],["sc_total","#f87171","SC(元)"]];
  var S_LIGHT = [["danmaku","#2563eb","弹幕"],["gift_gold","#d97706","礼物(元)"],
                 ["ship_gold","#059669","上舰(元)"],["sc_total","#dc2626","SC(元)"]];
  function fmt(v){ v = +v||0; return Math.abs(v)>=100 ? String(Math.round(v)) : (Math.round(v*10)/10).toString(); }
  var PL=44, PR=12, step=0, n=0;
  function draw(){
    var isLight = lightMode();
    var series = isLight ? S_LIGHT : S;
    var W = el.clientWidth || 600; if(W < 260) W = 260;
    var H = 250, iw = W-PL-PR, ih = H-40; n = data.length;
    var peak = 1;
    for(var s=0;s<series.length;s++){
      var arr = data.map(function(r){ return +r[series[s][0]]||0; });
      series[s][3] = arr;
      for(var i=0;i<arr.length;i++) if(arr[i]>peak) peak = arr[i];
    }
    function X(i){ return PL + (n>1 ? i*iw/(n-1) : iw/2); }
    function Y(v){ return 14 + ih - (v/peak)*ih; }
    step = n>1 ? iw/(n-1) : 0;
    var g = '';
    for(var f=0;f<=4;f++){
      var y = 14 + ih - ih*f/4;
      g += '<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="var(--grid)"/>' +
           '<text x="'+(PL-6)+'" y="'+(y+3)+'" font-size="10" fill="#64748b" text-anchor="end">'+fmt(peak*f/4)+'</text>';
    }
    var labN = Math.min(n, Math.max(2, Math.floor(W/90)));
    for(var j=0;j<labN;j++){
      var i2 = labN>1 ? Math.round(j*(n-1)/(labN-1)) : 0;
      var lab = data[i2].day;
      if(mode === 'monthly' && lab.length >= 7) lab = lab.slice(0, 7);
      else if(lab.length >= 10) lab = lab.slice(5, 10);
      g += '<text x="'+X(i2)+'" y="'+(H-8)+'" font-size="10" fill="#64748b" text-anchor="middle">'+lab+'</text>';
    }
    var sv = '<svg width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg">'+g;
    for(var s2=0;s2<series.length;s2++){
      var pts = series[s2][3].map(function(v,i3){ return X(i3).toFixed(1)+','+Y(v).toFixed(1); }).join(' ');
      sv += '<polyline fill="none" stroke="'+series[s2][1]+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts+'"/>';
    }
    sv += '</svg>';
    el.innerHTML = sv;
    var svg = el.querySelector('svg');
    function pos(e){
      var cx = (e.touches ? e.touches[0].clientX : e.clientX);
      var r = svg.getBoundingClientRect();
      var i = step ? Math.round((cx - r.left - PL)/step) : 0;
      i = Math.max(0, Math.min(n-1, i));
      var rows = '<b>'+data[i].day+'</b>';
      for(var s3=0;s3<series.length;s3++)
        rows += '<br><span style="color:'+series[s3][1]+'">●</span> '+series[s3][2]+': '+fmt(series[s3][3][i]);
      tip.innerHTML = rows;
      tip.classList.remove('hidden');
      var box = el.parentElement.getBoundingClientRect();
      var lx = cx - box.left + 14;
      if(lx + 150 > box.width) lx = cx - box.left - 164;
      if(lx < 0) lx = 0;
      tip.style.left = lx+'px'; tip.style.top = '10px';
    }
    function hide(){ tip.classList.add('hidden'); }
    svg.addEventListener('mousemove', pos);
    svg.addEventListener('mouseleave', hide);
    svg.addEventListener('touchstart', pos, {passive:true});
    svg.addEventListener('touchmove', pos, {passive:true});
    svg.addEventListener('touchend', hide);
  }
  var rt = null;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(draw, 200); });
  if(window.matchMedia){
    try{ window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){ draw(); }); }catch(e){}
  }
  draw();
};
</script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans antialiased">
<header class="sticky top-0 z-20 backdrop-blur bg-slate-950/80 border-b border-slate-800">
  <div class="max-w-6xl mx-auto px-4 py-3">
    <div class="flex items-center justify-between gap-2">
      <a href="/" hx-get="/" hx-target="#page" hx-swap="outerHTML" hx-push-url="/"
         class="flex items-center gap-2 min-w-0">
        <span class="w-2.5 h-2.5 rounded-full bg-pink-500 shadow-[0_0_8px_rgba(236,72,153,.8)] shrink-0"></span>
        <span class="text-lg font-bold tracking-wide truncate">BLivePost <span class="text-slate-500 font-normal text-sm">面板</span></span>
      </a>
      <span class="hidden sm:inline text-xs text-slate-500 shrink-0">只读数据 · 操作需谨慎</span>
    </div>
    <nav class="nav-scroll mt-2 -mx-1 flex items-center gap-1 overflow-x-auto whitespace-nowrap">
      {% for path, key, label in nav %}
      <a href="{{ path }}" hx-get="{{ path }}" hx-target="#page" hx-swap="outerHTML" hx-push-url="{{ path }}"
         class="shrink-0 px-3 py-1.5 rounded-lg text-sm transition-colors {{ 'nav-active' if page == key else 'text-slate-400 hover:text-slate-200 hover:bg-slate-900' }}">{{ label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
<main class="max-w-6xl mx-auto px-4 py-6">
  <div id="page">{% include page_template %}</div>
</main>
</body>
</html>
